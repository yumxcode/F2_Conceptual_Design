# 反向求需求：身高、腿长、臂长等尺寸已定 → 求每个关节模组要达到的扭矩/转速/持续扭矩，并给出目录选型
#
#   python scripts/screen_humanoid.py concept --config experiments/screening/given_dimensions.yaml
#
# 尺寸直接写米数（写了就覆盖比例）；没写的按默认比例。

name: given-dims-1p65m

body:
  height_m: 1.65
  leg_length_m: 0.74          # 髋关节中心 → 踝关节中心
  thigh_m: 0.37               # 髋 → 膝
  upper_arm_m: 0.28           # 肩 → 肘
  forearm_m: 0.24             # 肘 → 腕
  hand_m: 0.10                # 腕 → 抓取点
  foot_length_m: 0.24

tasks:
  walk:       {speed: 1.2, max_speed: 1.6}
  stairs:     {step_height_m: 0.17}
  squat_lift: {enabled: true}
  stoop_lift: {enabled: true}
  run:        {enabled: false}

payload: {hands_total_kg: 8.0}
electrical: {runtime_h: 3.0}

# 只做校核（不改臂长）：报告里会列出是否够得到
reach:
  floor_pick_height_m: 0.10
  shelf_height_m: 1.80

actuators:
  mode: catalog               # 从目录真实模组中选；trend 则只给假想规格
