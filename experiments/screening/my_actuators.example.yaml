# 自有供应商模组清单（模板）。在概念 YAML 里写
#   actuators: {extra_catalog: experiments/screening/my_actuators.yaml}
# 即与 Draft 自带的 114 款一起参与选型。也可以用同名列的 CSV。
#
# 必填：name, tau_peak_Nm（峰值扭矩）, omega_NL_rad_s（输出端空载转速）, mass_kg
# 选填：vendor, category（QDD/MidGear/Harmonic/任意）, gear（减速比）,
#       tau_cont_Nm（持续/额定扭矩，强烈建议填，否则按峰值/类别系数估算）,
#       OD_mm, L_mm, rotor_inertia_kgm2, rotor_inertia_kind（rotor=电机侧 / output=已折算到输出端）
#
# 下面是格式示例，数值是虚构的，不是任何真实产品；请替换为供应商规格书或实测数据。

- name: EXAMPLE-KNEE-MODULE
  vendor: example
  category: QDD
  tau_peak_Nm: 250
  tau_cont_Nm: 90
  omega_NL_rad_s: 18
  gear: 15
  mass_kg: 2.4
  OD_mm: 130
  L_mm: 70
